[workspace]
members = [
    ".",
    "crates/lio-subsonic",
    "crates/lio-store",
    "crates/lio-playback",
    "crates/lio-bench",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
authors = ["m5ka <git@m5ka.dev>"]
repository = "https://github.com/m5ka/lio"

[workspace.dependencies]
lio-subsonic = { path = "crates/lio-subsonic" }
lio-store = { path = "crates/lio-store" }
lio-playback = { path = "crates/lio-playback" }

gtk = { package = "gtk4", version = "0.11", features = ["gnome_49"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
gst = { package = "gstreamer", version = "0.25" }
gst-base = { package = "gstreamer-base", version = "0.25" }
gst-audio = { package = "gstreamer-audio", version = "0.25" }
glycin = { version = "4", default-features = false, features = ["glycin-external", "gdk4", "tokio"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "stream", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
url = "2"
futures-util = "0.3"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.41", features = ["functions"] }

mpris-server = "0.10"
ksni = { version = "0.3.7", default-features = false, features = ["tokio"] }
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "background"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }

wiremock = "0.6"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[package]
name = "lio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[lints]
workspace = true

[[bin]]
name = "lio"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
harness = true

[dependencies]
lio-subsonic.workspace = true
lio-store.workspace = true
rusqlite.workspace = true
lio-playback.workspace = true
gtk.workspace = true
adw.workspace = true
gst.workspace = true
glycin.workspace = true
image.workspace = true
tokio.workspace = true
url.workspace = true
async-channel.workspace = true
futures-util.workspace = true
mpris-server.workspace = true
ksni.workspace = true
oo7.workspace = true
ashpd.workspace = true
gettext-rs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
uuid.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
zbus = { version = "5", default-features = false, features = ["tokio"] }

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
